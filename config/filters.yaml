# CrowdSieve Configuration

proxy:
  listen_port: 8080
  capi_url: 'https://api.crowdsec.net'
  timeout_ms: 30000
  # Set to false to disable forwarding to CAPI (test mode)
  forward_enabled: true

storage:
  path: './data/crowdsieve.db'
  retention_days: 30

logging:
  level: info # debug, info, warn, error
  format: json # json, pretty

# Filter configuration
# mode: "block" = matching alerts are NOT forwarded to CAPI
# mode: "allow" = only matching alerts are forwarded to CAPI
filters:
  mode: 'block'
  # Rules are loaded from filters.d/ directory

# Local LAPI servers for manual decisions (bans)
# These are CrowdSec instances where you can push manual ban decisions
# from the dashboard. The api_key must have write access to decisions.
# lapi_servers:
#   - name: "server1"
#     url: "http://localhost:8081"
#     api_key: "your-lapi-api-key-here"
#   - name: "server2"
#     url: "http://192.168.1.10:8080"
#     api_key: "another-api-key"

# Bouncer metrics collection (optional)
# Periodically polls /v1/usage-metrics on each configured LAPI server
# (CrowdSec >= 1.6) to record per-bouncer rejection statistics.
# Disabled by default. Reuses the api_key from each lapi_servers entry.
# bouncer_metrics:
#   enabled: true
#   interval_seconds: 300       # Poll every 5 minutes
#   retention_days: 30          # Snapshot retention
#   request_timeout_ms: 10000   # Per-request timeout
