# CrowdSieve Configuration

proxy:
  listen_port: 8080
  capi_url: 'https://api.crowdsec.net'
  timeout_ms: 30000
  # Set to false to disable forwarding to CAPI (test mode)
  forward_enabled: true

storage:
  path: './data/crowdsieve.db'
  retention_days: 30

logging:
  level: info # debug, info, warn, error
  format: json # json, pretty

# Filter configuration
# mode: "block" = matching alerts are NOT forwarded to CAPI
# mode: "allow" = only matching alerts are forwarded to CAPI
filters:
  mode: 'block'
  # Rules are loaded from filters.d/ directory

# Local LAPI servers for manual decisions (bans)
# These are CrowdSec instances where you can push manual ban decisions
# from the dashboard. The api_key must have write access to decisions.
# lapi_servers:
#   - name: "server1"
#     url: "http://localhost:8081"
#     api_key: "your-lapi-api-key-here"
#   - name: "server2"
#     url: "http://192.168.1.10:8080"
#     api_key: "another-api-key"
#     # Decision replication (see README "Decision Replication"): decisions
#     # received through signals are only replicated from senders authenticated
#     # against CAPI whose online API login (online_api_credentials.yaml) is
#     # listed in some server's source_machine_ids.
#     machine_id: "crowdsieve"
#     password: "machine-password"
#     replicate_decisions: true
#     source_machine_ids: ["online-api-login-of-server2"]

# Limits on replicated decisions (only Ip/Range scopes, ban/captcha types,
# no range broader than IPv4 /16 or IPv6 /32 are ever replicated).
# Longer decisions are replicated with this duration (Go syntax, no "d" unit).
# replication:
#   max_decision_duration: "168h"

# Bouncer metrics (always-on capture)
# CrowdSieve intercepts the usage-metrics that CrowdSec LAPI relays to CAPI,
# stores them locally, and forwards the payload upstream unchanged.
# Only retention is configurable.
# bouncer_metrics:
#   retention_days: 30

# Webhook notifications (see README "Notifications")
# Each target receives one or more events: alert, manual_ban, unban,
# forwarding_error (CAPI), lapi_error (LAPI unreachable/recovered, replication
# failures). Within min_interval (Go duration, default "5m"), further events of
# the same target and type are grouped into one digest message.
# Use ${VAR} to keep secrets (tokens, webhook URLs) out of this file.
# notifications:
#   dashboard_url: "https://crowdsieve.example.com" # used for the links
#   targets:
#     - name: soc-chat
#       type: slack # Slack-compatible incoming webhook (Mattermost, Rocket.Chat)
#       url: "${SOC_CHAT_WEBHOOK_URL}"
#       events: [alert, manual_ban, unban]
#       match: # alerts only; every list is optional
#         scenarios: [ssh-bf, smtp] # substrings of the scenario
#         countries: [FR]
#         machines: [mail-agent]
#         status: forwarded # forwarded (default), filtered or any
#       min_interval: 5m
#     - name: incidents
#       type: webhook # generic JSON POST
#       url: "https://incidents.example.com/hooks/crowdsieve"
#       headers:
#         Authorization: "Bearer ${INCIDENTS_TOKEN}"
#       events: [forwarding_error, lapi_error]
#       min_interval: 15m
