name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Minimal permissions for security (CodeQL recommendation)
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false

  test-postgres:
    name: Test PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: crowdsieve
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: crowdsieve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install pg (optional dependency)
        run: npm install pg

      - name: Run PostgreSQL tests
        run: npm run test:postgres
        env:
          STORAGE_TYPE: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DATABASE: crowdsieve_test
          POSTGRES_USER: crowdsieve
          POSTGRES_PASSWORD: testpassword

  helm:
    name: Helm Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Update Helm dependencies
        run: helm dependency update ./helm/crowdsieve

      - name: Lint Helm chart
        run: helm lint ./helm/crowdsieve

      - name: Test template (SQLite default)
        run: |
          helm template test ./helm/crowdsieve > /dev/null
          echo "SQLite template OK"

      - name: Test template (PostgreSQL)
        run: |
          helm template test ./helm/crowdsieve \
            --set crowdsieve.storage.type=postgres \
            --set crowdsieve.storage.postgres.host=postgres.local \
            --set crowdsieve.storage.postgres.database=crowdsieve \
            --set crowdsieve.storage.postgres.user=crowdsieve \
            --set crowdsieve.storage.postgres.password=testpass > /dev/null
          echo "PostgreSQL template OK"

      - name: Test template (with GeoIP)
        run: |
          helm template test ./helm/crowdsieve \
            --set crowdsieve.geoip.enabled=true \
            --set crowdsieve.geoip.maxmindLicenseKey=test-key > /dev/null
          echo "GeoIP template OK"

      - name: Verify PostgreSQL env vars present
        run: |
          helm template test ./helm/crowdsieve \
            --set crowdsieve.storage.type=postgres \
            --set crowdsieve.storage.postgres.host=pg.local \
            --set crowdsieve.storage.postgres.database=mydb \
            --set crowdsieve.storage.postgres.user=user \
            --set crowdsieve.storage.postgres.password=pass | \
            grep -q "POSTGRES_HOST" && echo "PostgreSQL env vars OK"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, test-postgres, helm]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build proxy
        run: npm run build

  e2e-oidc:
    name: E2E OIDC Tests
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start E2E environment
        working-directory: tests/e2e
        run: docker compose -f docker-compose.oidc.yaml up -d --build

      - name: Wait for services
        run: |
          echo "Waiting for services to be healthy..."
          for i in {1..60}; do
            if docker exec llng-oidc-test curl -sf http://localhost/ > /dev/null 2>&1 && \
               curl -sf http://localhost:18080/health > /dev/null 2>&1; then
              echo "Services are ready"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Services did not become ready in time"
              docker compose -f tests/e2e/docker-compose.oidc.yaml logs
              exit 1
            fi
            sleep 2
          done

      - name: Verify OIDC discovery
        run: |
          echo "Checking OIDC discovery endpoint..."
          for i in {1..30}; do
            if curl -sf http://localhost:19080/.well-known/openid-configuration | jq -e '.issuer' > /dev/null 2>&1; then
              echo "OIDC discovery is working"
              curl -s http://localhost:19080/.well-known/openid-configuration | jq '{issuer, token_endpoint, jwks_uri}'
              exit 0
            fi
            echo "Attempt $i: OIDC not ready yet..."
            sleep 2
          done
          echo "OIDC discovery failed"
          docker logs llng-oidc-test 2>&1 | tail -50
          exit 1

      - name: Run E2E OIDC tests
        working-directory: tests/e2e
        run: ./test-oidc.sh

      - name: Show logs on failure
        if: failure()
        working-directory: tests/e2e
        run: |
          echo "=== LLNG Logs ==="
          docker logs llng-oidc-test 2>&1 | tail -100
          echo "=== CrowdSieve Logs ==="
          docker logs crowdsieve-oidc-test 2>&1 | tail -100

      - name: Cleanup
        if: always()
        working-directory: tests/e2e
        run: docker compose -f docker-compose.oidc.yaml down -v

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, test-postgres, helm]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: crowdsieve:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
