name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKER: docker.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Each job declares the least privilege it needs: only the Helm and OpenAPI
  # jobs push to the repository, only the Docker jobs push to a registry.

  # Build and push Docker image (amd64 first, fast)
  docker-amd64:
    name: Build & Push Docker (amd64)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY_DOCKER }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/linagora/crowdsieve
            ${{ env.REGISTRY_DOCKER }}/yadd/crowdsieve
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.REGISTRY_GHCR }}/linagora/crowdsieve:${{ steps.version.outputs.version }}-amd64
            ${{ env.REGISTRY_DOCKER }}/yadd/crowdsieve:${{ steps.version.outputs.version }}-amd64
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

  # Build arm64 (slow, runs in parallel with helm)
  docker-arm64:
    name: Build & Push Docker (arm64)
    runs-on: ubuntu-latest
    needs: docker-amd64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY_DOCKER }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY_GHCR }}/linagora/crowdsieve:${{ needs.docker-amd64.outputs.version }}-arm64
            ${{ env.REGISTRY_DOCKER }}/yadd/crowdsieve:${{ needs.docker-amd64.outputs.version }}-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.docker-amd64.outputs.version }}

  # Create multi-arch manifest (after both builds complete)
  docker-manifest:
    name: Create Multi-arch Manifest
    runs-on: ubuntu-latest
    needs: [docker-amd64, docker-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY_DOCKER }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        env:
          VERSION: ${{ needs.docker-amd64.outputs.version }}
        run: |
          # Extract major.minor and major versions
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          MAJOR=$(echo "$VERSION" | cut -d. -f1)

          # GHCR manifests
          docker buildx imagetools create -t ${{ env.REGISTRY_GHCR }}/linagora/crowdsieve:${VERSION} \
            ${{ env.REGISTRY_GHCR }}/linagora/crowdsieve:${VERSION}-amd64 \
            ${{ env.REGISTRY_GHCR }}/linagora/crowdsieve:${VERSION}-arm64

          docker buildx imagetools create -t ${{ env.REGISTRY_GHCR }}/linagora/crowdsieve:${MAJOR_MINOR} \
            ${{ env.REGISTRY_GHCR }}/linagora/crowdsieve:${VERSION}-amd64 \
            ${{ env.REGISTRY_GHCR }}/linagora/crowdsieve:${VERSION}-arm64

          docker buildx imagetools create -t ${{ env.REGISTRY_GHCR }}/linagora/crowdsieve:${MAJOR} \
            ${{ env.REGISTRY_GHCR }}/linagora/crowdsieve:${VERSION}-amd64 \
            ${{ env.REGISTRY_GHCR }}/linagora/crowdsieve:${VERSION}-arm64

          docker buildx imagetools create -t ${{ env.REGISTRY_GHCR }}/linagora/crowdsieve:latest \
            ${{ env.REGISTRY_GHCR }}/linagora/crowdsieve:${VERSION}-amd64 \
            ${{ env.REGISTRY_GHCR }}/linagora/crowdsieve:${VERSION}-arm64

          # Docker Hub manifests
          docker buildx imagetools create -t ${{ env.REGISTRY_DOCKER }}/yadd/crowdsieve:${VERSION} \
            ${{ env.REGISTRY_DOCKER }}/yadd/crowdsieve:${VERSION}-amd64 \
            ${{ env.REGISTRY_DOCKER }}/yadd/crowdsieve:${VERSION}-arm64

          docker buildx imagetools create -t ${{ env.REGISTRY_DOCKER }}/yadd/crowdsieve:${MAJOR_MINOR} \
            ${{ env.REGISTRY_DOCKER }}/yadd/crowdsieve:${VERSION}-amd64 \
            ${{ env.REGISTRY_DOCKER }}/yadd/crowdsieve:${VERSION}-arm64

          docker buildx imagetools create -t ${{ env.REGISTRY_DOCKER }}/yadd/crowdsieve:${MAJOR} \
            ${{ env.REGISTRY_DOCKER }}/yadd/crowdsieve:${VERSION}-amd64 \
            ${{ env.REGISTRY_DOCKER }}/yadd/crowdsieve:${VERSION}-arm64

          docker buildx imagetools create -t ${{ env.REGISTRY_DOCKER }}/yadd/crowdsieve:latest \
            ${{ env.REGISTRY_DOCKER }}/yadd/crowdsieve:${VERSION}-amd64 \
            ${{ env.REGISTRY_DOCKER }}/yadd/crowdsieve:${VERSION}-arm64

  # Release Helm chart (runs in parallel with docker-arm64)
  helm:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    needs: docker-amd64
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Setup Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.14.0

      - name: Add Helm repositories
        run: |
          helm repo add crowdsec https://crowdsecurity.github.io/helm-charts
          helm repo update

      - name: Update Helm dependencies
        run: helm dependency update ./helm/crowdsieve

      - name: Update Chart version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Setting chart version to $VERSION"
          sed -i "s/^version:.*/version: $VERSION/" helm/crowdsieve/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" helm/crowdsieve/Chart.yaml
          cat helm/crowdsieve/Chart.yaml

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        with:
          charts_dir: helm
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  # GitHub Release is created manually when needed
  # To create a release: gh release create vX.Y.Z --generate-notes

  # Publish OpenAPI documentation to GitHub Pages
  # Output: https://linagora.github.io/crowdsieve/api/
  # Runs AFTER helm so the two jobs don't race on pushing to gh-pages.
  # keep_files:true preserves helm's index.yaml + .tgz at the branch root.
  openapi-docs:
    name: Publish OpenAPI Documentation
    runs-on: ubuntu-latest
    needs: helm
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Update npm to 11.12+ (lockfile readability fix)
        run: npm install -g npm@11.21.3

      - name: Install dependencies
        run: npm ci

      - name: Generate openapi.json
        run: npm run openapi:generate

      - name: Render Redoc HTML
        run: |
          mkdir -p site
          cp openapi.json site/openapi.json
          npx --yes @redocly/cli@2.80.0 build-docs site/openapi.json -o site/index.html

      - name: Deploy to GitHub Pages (api/ subdirectory)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: api
          keep_files: true
          commit_message: "docs(api): publish OpenAPI for ${{ github.ref_name }}"

  # Update Docker Hub README (runs after manifest is complete)
  dockerhub-readme:
    name: Update Docker Hub README
    runs-on: ubuntu-latest
    needs: [docker-manifest, helm]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: yadd/crowdsieve
          short-description: "Filtering proxy for CrowdSec - filter alerts before sending to CAPI"
          readme-filepath: ./README.md
