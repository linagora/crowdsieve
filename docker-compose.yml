version: '3.8'

services:
  crowdsieve:
    build: .
    container_name: crowdsieve
    restart: unless-stopped
    ports:
      # Proxy API: published on all interfaces because CrowdSec LAPIs on
      # other hosts must reach it. Restrict it to your LAPIs with a firewall.
      - "${PROXY_PORT:-8080}:8080"
      # Dashboard UI: bound to the loopback interface by default. Set
      # DASHBOARD_BIND=0.0.0.0 to publish it on all interfaces only once
      # authentication is configured below (or put an authenticating reverse
      # proxy in front of it; a proxy container on the same Docker network
      # can reach crowdsieve:3000 whatever this binding).
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-3000}:3000"
    volumes:
      - ./config:/app/config:ro
      - crowdsieve-data:/app/data
    environment:
      - NODE_ENV=production
      - CONFIG_PATH=/app/config/filters.yaml
      - DATABASE_PATH=/app/data/crowdsieve.db
      - GEOIP_DB_PATH=/app/data/geoip-city.mmdb
      - PROXY_PORT=8080
      - DASHBOARD_PORT=3000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      # Dashboard authentication (see docs/oidc-authentication.md). Without
      # AUTH_MODE nor OIDC settings the dashboard has NO authentication: anyone
      # who reaches it can ban and unban IPs (a warning is logged at startup).
      # - AUTH_MODE=oidc            # oidc | headers | none
      # OIDC mode:
      # - OIDC_ISSUER=https://auth.example.com/realms/myrealm
      # - OIDC_CLIENT_ID=crowdsieve-dashboard
      # - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      # - SESSION_SECRET=${SESSION_SECRET}         # required, openssl rand -hex 32
      # - NEXTAUTH_URL=https://crowdsieve.example.com
      # Headers mode (identity forwarded by an authenticating reverse proxy):
      # - AUTH_MODE=headers
      # - AUTH_PROXY_SECRET=${AUTH_PROXY_SECRET}   # sent by the proxy in X-Auth-Proxy-Secret
      # No authentication, on purpose (access restricted by other means):
      # - AUTH_MODE=none
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - crowdsec-network

volumes:
  crowdsieve-data:
    driver: local

networks:
  crowdsec-network:
    driver: bridge
